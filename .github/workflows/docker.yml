name: docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait --wait-timeout 30
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/health
      - if: always()
        run: docker compose down --volumes
